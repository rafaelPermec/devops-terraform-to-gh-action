name: Pipeline de Integração Contínua (CI)

on:
  push:
    branches:
      - main

jobs:
  # Job 1: Analiza a qualidade do codigo-fonte e executa testes
  validacao-aplicacao:
    runs-on: ubuntu-latest
    steps:
      - name: Obter Codigo do Repositorio (Checkout)
        uses: actions/checkout@v3

      - name: Simular Analise de Linter
        run: |
          echo "=> Iniciando verificacao automatizada de padronizacao de codigo..."
          echo "[SUCCESS] Linter finalizado: Padrao de projeto mantido com sucesso."

      - name: Simular Testes Automatizados
        run: |
          echo "=> Rodando suite de testes automatizados integrados..."
          echo "[SUCCESS] 12 testes executados. 0 falhas encontradas."

  # Job 2: Valida a sintaxe e a formatacao do nosso codigo Terraform
  validacao-infraestrutura:
    runs-on: ubuntu-latest
    steps:
      - name: Obter Codigo do Repositorio (Checkout)
        uses: actions/checkout@v3

      - name: Configurar Ferramenta Terraform no Runner
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Verificar Formatacao do Codigo (Terraform Fmt)
        run: terraform fmt -check

      - name: Inicializacao Estrutural (Sem Backend Real)
        run: terraform init -backend=false

      - name: Validar Sintaxe dos Arquivos (Terraform Validate)
        run: terraform validate

# Job 3: Realiza o empacotamento e executa testes reais no container localmente no runner
  build-e-teste-conteiner:
    needs: [validacao-aplicacao, validacao-infraestrutura]
    runs-on: ubuntu-latest
    steps:
      - name: Obter Codigo do Repositorio (Checkout)
        uses: actions/checkout@v3

      - name: Executar Build Real da Imagem Docker
        run: |
          echo "=> Construindo artefato imutavel com Docker..."
          docker build -t minha-app-pucrs:${{ github.sha }} .

      - name: Dar permissão de execução ao Script de Deploy
        run: chmod +x ./deploy.sh

      - name: Executar Script de Deploy e Testar Container de Produção
        run: ./deploy.sh ${{ github.sha }}

      - name: Limpar Container de Teste do Runner
        run: |
          echo "=> Derrubando infraestrutura local do runner pós-teste..."
          docker stop app_pucrs_prod
          docker rm app_pucrs_prod

  # Job 4: Simula a analise de seguranca do container gerado
  seguranca-container:
    needs: build-e-teste-conteiner
    runs-on: ubuntu-latest
    steps:
      - name: Simular Scan de Vulnerabilidades (SAST/DAST)
        run: |
          echo "=> Analisando a imagem Docker em busca de vulnerabilidades (CVEs)..."
          echo "[SUCCESS] Nenhum risco critico encontrado. Imagem aprovada para deploy."

  # Job 5: Gerencia a Entrega Continua (CD) simulando a esteira progressiva de deploy nos ambientes organizacionais
  entrega-continua-cd:
    needs: build-e-teste-conteiner
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ambiente: [DEV, TST, HOL, PRD]
    steps:
      - name: Simular Implantacao nos Ambientes Organizacionais
        run: |
          echo "================================================================"
          echo "=> Iniciando processo de implantacao automatizada via CD..."
          echo "[DEPLOY] Extraindo imagem tag ${{ github.sha }} do registro."
          echo "[CONFIG] Aplicando itens de configuracao atualizados via Git Baseline."
          echo "[SUCCESS] Aplicacao implantada com total sucesso no ambiente de: ${{ matrix.ambiente }}"
          echo "================================================================"